<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Raspberry Pi 電子工作シミュレータ</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0c0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom))}.head{display:flex;align-items:center;gap:8px;margin-bottom:12px}.title{font-size:20px;font-weight:850}.v{font-size:10px;color:#fff6}.card{background:#15171c;border:1px solid #ffffff14;border-radius:18px;padding:14px;margin:10px 0}.lesson-list{display:grid;gap:8px}.lesson{width:100%;text-align:left;border:1px solid #ffffff14;background:#101217;color:#fff;border-radius:14px;padding:12px}.lesson.active{outline:2px solid #fff}.lesson small{display:block;color:#bfc5d0;margin-top:4px}.board{position:relative;height:310px;background:#1b422f;border-radius:18px;border:1px solid #ffffff20;overflow:hidden}.pi{position:absolute;left:16px;top:16px;width:44%;height:278px;border-radius:16px;background:#267a54;padding:12px}.pi h3{margin:0 0 8px;font-size:14px}.pins{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px}.pin{background:#111b;border-radius:7px;padding:6px}.pin.hot{outline:2px solid #ffd34e}.bread{position:absolute;right:16px;top:16px;width:47%;height:278px;border-radius:16px;background:#ececec;color:#111;padding:12px}.component{padding:8px;border-radius:10px;background:#fff;margin:8px 0;border:1px solid #bbb}.component.on{box-shadow:0 0 24px #ffd83d;background:#fff6b2}.wire{font-size:12px;line-height:1.55}.controls{display:flex;gap:8px;margin-top:10px}.controls button{flex:1;border:0;border-radius:12px;padding:11px;font-weight:750}.primary{background:#fff;color:#000}.secondary{background:#23262d;color:#fff}.steps{margin:0;padding-left:22px}.steps li{margin:8px 0;color:#d9dde5}.steps li.done{color:#7ee787}.code{white-space:pre-wrap;background:#08090b;border-radius:14px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow:auto}.warning{background:#2c2110;border:1px solid #ffcb6b55;color:#ffe1a6}.note{font-size:12px;color:#bcc3cf;line-height:1.55}.simrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.simrow button{border:1px solid #ffffff18;background:#20232a;color:#fff;border-radius:11px;padding:9px 11px;font-weight:700}</style></head><body><div class="head"><div class="title">Raspberry Pi 電子工作シミュレータ</div><div class="v">v1</div></div><div class="card warning"><b>実機で触る前に</b><div class="note">GPIOは3.3Vです。5VをGPIOへ直接入れない、LEDには抵抗を入れる、配線変更は電源を切ってから行う、を基本ルールにしてください。このページは学習用シミュレータです。</div></div><div class="card"><b>レッスン</b><div class="lesson-list" id="lessons"></div></div><div class="card"><div id="lessonTitle" style="font-weight:800;margin-bottom:8px"></div><div class="board"><div class="pi"><h3>Raspberry Pi</h3><div class="pins" id="pins"></div></div><div class="bread"><b>ブレッドボード側</b><div id="components"></div></div></div><div class="controls"><button class="secondary" id="prev">1つ戻す</button><button class="primary" id="next">次の配線へ</button></div></div><div class="card"><b>日本語ハンズオン</b><ol class="steps" id="steps"></ol></div><div class="card"><b>シミュレーション</b><div class="simrow" id="sim"></div><div class="note" id="simText" style="margin-top:8px"></div></div><div class="card"><b>実機で使うPython例</b><div class="code" id="code"></div><div class="note">Raspberry Pi OSのバージョンや利用ライブラリによって手順は変わることがあります。ここでは考え方を理解するための最小例を示しています。</div></div><script>(()=>{const lessons=[{title:'1. LEDを光らせる',desc:'GPIOの出力を最初に体験',pins:['3.3V','GND','GPIO17'],parts:['LED','330Ω抵抗'],steps:['Raspberry Piの電源を切る。','GPIO17 → 330Ω抵抗 → LEDの長い脚の順につなぐ。','LEDの短い脚をGNDへつなぐ。','配線を見直してから電源を入れる。','画面下の「LED ON」で動作をイメージする。'],code:`from gpiozero import LED\nfrom time import sleep\n\nled = LED(17)\nwhile True:\n    led.on()\n    sleep(1)\n    led.off()\n    sleep(1)`,mode:'led'},{title:'2. ボタンを読む',desc:'入力とプルアップを理解',pins:['GND','GPIO27'],parts:['タクトスイッチ'],steps:['Raspberry Piの電源を切る。','ボタンの片側をGPIO27へつなぐ。','反対側をGNDへつなぐ。','内部プルアップを使うので外付け抵抗は不要。','「ボタンを押す」で入力の変化を見る。'],code:`from gpiozero import Button\n\nbutton = Button(27, pull_up=True)\nbutton.when_pressed = lambda: print("押された")\nbutton.when_released = lambda: print("離された")\n\ninput("Enterで終了")`,mode:'button'},{title:'3. 2つのLEDを交互点灯',desc:'複数GPIOを扱う',pins:['GND','GPIO17','GPIO27'],parts:['LED ×2','330Ω抵抗 ×2'],steps:['GPIO17とGPIO27をそれぞれ抵抗経由でLEDへつなぐ。','2つのLEDの短い脚をGNDへつなぐ。','2本のGPIOが同時にショートしていないか確認する。','交互点灯を実行して状態の切替を見る。'],code:`from gpiozero import LED\nfrom time import sleep\n\na = LED(17)\nb = LED(27)\nwhile True:\n    a.on(); b.off(); sleep(0.5)\n    a.off(); b.on(); sleep(0.5)`,mode:'twoled'},{title:'4. LEDの明るさを変える',desc:'PWMの考え方を体験',pins:['GND','GPIO18'],parts:['LED','330Ω抵抗'],steps:['GPIO18 → 330Ω抵抗 → LED → GND と配線する。','PWMは高速ON/OFFで平均的な明るさを変える仕組み。','スライダーで明るさを変えてみる。'],code:`from gpiozero import PWMLED\nfrom time import sleep\n\nled = PWMLED(18)\nfor i in range(11):\n    led.value = i / 10\n    sleep(0.2)`,mode:'pwm'},{title:'5. 温度センサーの考え方',desc:'センサー入力とプルアップ',pins:['3.3V','GND','GPIO4'],parts:['DS18B20','4.7kΩ抵抗'],steps:['センサーのVDDを3.3V、GNDをGNDへつなぐ。','DATAをGPIO4へつなぐ。','DATAと3.3Vの間に4.7kΩ抵抗を入れる。','1-Wire通信はデータ線1本で値を読む方式。','シミュレーションで温度を変えて読み値を見る。'],code:`# DS18B20は1-Wire設定が必要です。\n# 初心者はgpiozeroのDigitalInputDeviceより\n# 専用ライブラリやRaspberry Pi OSの1-Wire機能を使うと理解しやすいです。`,mode:'temp'}];const pinNames=['3.3V (物理1)','5V (物理2)','GPIO4 (物理7)','GND (物理6)','GPIO17 (物理11)','GPIO18 (物理12)','GPIO27 (物理13)','GPIO22 (物理15)'];let li=0,step=0;const lessonBox=document.getElementById('lessons');lessons.forEach((l,i)=>{let b=document.createElement('button');b.className='lesson';b.innerHTML=`<b>${l.title}</b><small>${l.desc}</small>`;b.onclick=()=>{li=i;step=0;render()};lessonBox.appendChild(b)});function render(){[...lessonBox.children].forEach((x,i)=>x.classList.toggle('active',i===li));const l=lessons[li];document.getElementById('lessonTitle').textContent=l.title;document.getElementById('pins').innerHTML=pinNames.map(p=>`<div class="pin ${l.pins.some(x=>p.startsWith(x))?'hot':''}">${p}</div>`).join('');document.getElementById('components').innerHTML=l.parts.map((p,i)=>`<div class="component ${step>i?'on':''}">${p}</div>`).join('')+`<div class="wire">${step===0?'「次の配線へ」で1工程ずつ進みます。':`配線工程 ${step} / ${l.steps.length}`}</div>`;document.getElementById('steps').innerHTML=l.steps.map((s,i)=>`<li class="${i<step?'done':''}">${s}</li>`).join('');document.getElementById('code').textContent=l.code;renderSim(l.mode);document.getElementById('prev').disabled=step===0;document.getElementById('next').textContent=step>=l.steps.length?'最初から見る':'次の配線へ'}function renderSim(mode){const sim=document.getElementById('sim'),txt=document.getElementById('simText');sim.innerHTML='';txt.textContent='';if(mode==='led'){let state=false,b=document.createElement('button');b.textContent='LED ON';let lamp=document.createElement('span');lamp.textContent='●';lamp.style.fontSize='28px';b.onclick=()=>{state=!state;lamp.style.color=state?'#ffe35a':'#555';b.textContent=state?'LED OFF':'LED ON'};sim.append(b,lamp)}else if(mode==='button'){let b=document.createElement('button');b.textContent='ボタンを押す';b.onpointerdown=()=>txt.textContent='GPIO27 = LOW（押された）';b.onpointerup=()=>txt.textContent='GPIO27 = HIGH（離された）';sim.append(b);txt.textContent='GPIO27 = HIGH（離されている）'}else if(mode==='twoled'){let b=document.createElement('button');b.textContent='交互点灯';let a=document.createElement('span'),z=document.createElement('span');a.textContent='●';z.textContent='●';a.style.fontSize=z.style.fontSize='28px';a.style.color='#ffe35a';z.style.color='#555';let on=false;b.onclick=()=>{on=!on;a.style.color=on?'#555':'#ffe35a';z.style.color=on?'#ffe35a':'#555'};sim.append(b,a,z)}else if(mode==='pwm'){let r=document.createElement('input'),lamp=document.createElement('span');r.type='range';r.min=0;r.max=100;r.value=35;lamp.textContent='●';lamp.style.fontSize='34px';r.oninput=()=>{lamp.style.color=`rgba(255,227,90,${.15+Number(r.value)/118})`;txt.textContent=`明るさ ${r.value}%`};r.oninput();sim.append(r,lamp)}else{let r=document.createElement('input');r.type='range';r.min=-10;r.max=50;r.value=23;r.oninput=()=>txt.textContent=`センサー読み値: ${r.value} ℃`;r.oninput();sim.append(r)}}document.getElementById('next').onclick=()=>{const max=lessons[li].steps.length;step=step>=max?0:step+1;render()};document.getElementById('prev').onclick=()=>{step=Math.max(0,step-1);render()};render()})();</script></body></html>
