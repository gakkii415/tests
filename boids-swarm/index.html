<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Boids Swarm</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020305;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;z-index:3}.tag,button{background:#000b;border:1px solid #fff2;color:#fff;border-radius:13px;padding:10px 12px;backdrop-filter:blur(14px)}.tag{font-weight:700}button{margin-left:auto}.hint{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;color:#fffa;white-space:nowrap}.v{position:fixed;right:9px;bottom:5px;font-size:10px;color:#fff5}</style></head><body><canvas id="c"></canvas><div class="top"><div class="tag">Boids Swarm</div><button id="reset">再生成</button></div><div class="hint">指を近づけると群れが逃げる</div><div class="v">v1</div><script>(()=>{const c=document.getElementById('c'),g=c.getContext('2d'),reset=document.getElementById('reset');let W,H,dpr,boids=[],mx=-999,my=-999;const N=180;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}function init(){boids=Array.from({length:N},()=>{let a=Math.random()*Math.PI*2;return{x:Math.random()*W,y:Math.random()*H,vx:Math.cos(a)*2,vy:Math.sin(a)*2}})}function norm(x,y,m=3){let l=Math.hypot(x,y)||1;return[x/l*m,y/l*m]}function loop(){g.fillStyle='rgba(2,3,5,.28)';g.fillRect(0,0,W,H);for(let i=0;i<N;i++){let b=boids[i],cx=0,cy=0,avx=0,avy=0,sx=0,sy=0,n=0;for(let j=0;j<N;j++){if(i===j)continue;let q=boids[j],dx=q.x-b.x,dy=q.y-b.y;if(dx>W/2)dx-=W;if(dx<-W/2)dx+=W;if(dy>H/2)dy-=H;if(dy<-H/2)dy+=H;let d2=dx*dx+dy*dy;if(d2<3600){cx+=dx;cy+=dy;avx+=q.vx;avy+=q.vy;n++;if(d2<400){sx-=dx/(d2+.1);sy-=dy/(d2+.1)}}}if(n){b.vx+=cx/n*.0015+avx/n*.018+sx*.28;b.vy+=cy/n*.0015+avy/n*.018+sy*.28}let dx=b.x-mx,dy=b.y-my,d=Math.hypot(dx,dy);if(d<130){b.vx+=dx/(d+1)*.5;b.vy+=dy/(d+1)*.5}[b.vx,b.vy]=norm(b.vx,b.vy,2.4);b.x=(b.x+b.vx+W)%W;b.y=(b.y+b.vy+H)%H;let a=Math.atan2(b.vy,b.vx);g.save();g.translate(b.x,b.y);g.rotate(a);g.fillStyle='#fff';g.beginPath();g.moveTo(8,0);g.lineTo(-5,3.5);g.lineTo(-3,0);g.lineTo(-5,-3.5);g.closePath();g.fill();g.restore()}requestAnimationFrame(loop)}addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});addEventListener('pointerdown',e=>{mx=e.clientX;my=e.clientY});addEventListener('pointerup',()=>{mx=my=-999});reset.onclick=init;addEventListener('resize',()=>{resize();init()});resize();init();loop()})();</script></body></html>
