<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>コマンドライン初心者シミュレータ</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0c0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}.head{display:flex;gap:8px;align-items:center;margin-bottom:12px}.title{font-size:20px;font-weight:850}.v{font-size:10px;color:#fff6}.card{background:#15171c;border:1px solid #ffffff14;border-radius:18px;padding:14px;margin:10px 0}.lesson{border:1px solid #ffffff14;border-radius:14px;padding:12px;margin:8px 0;background:#101217}.lesson.done{border-color:#4bd17f55}.progress{font-size:12px;color:#bfc6d2}.terminal{background:#000;border:1px solid #ffffff1c;border-radius:16px;overflow:hidden}.bar{padding:9px 12px;background:#202228;color:#c9ced8;font-size:12px}.screen{min-height:300px;max-height:50vh;overflow:auto;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.55;white-space:pre-wrap}.inputrow{display:flex;border-top:1px solid #ffffff16}.prompt{padding:12px 0 12px 12px;color:#73e0a9;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.inputrow input{flex:1;background:#000;color:#fff;border:0;outline:0;padding:12px 10px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;min-width:0}.inputrow button{border:0;background:#fff;color:#000;padding:0 14px;font-weight:800}.help{font-size:13px;color:#d8dde6;line-height:1.65}.hint{padding:10px;border-radius:12px;background:#0f2619;color:#a9f1c7;margin-top:8px}.explain{font-size:13px;color:#d9dee7;line-height:1.65}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chips button{border:1px solid #ffffff16;background:#23262d;color:#fff;border-radius:10px;padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.danger{color:#ffb4b4}.ok{color:#8bf0b5}</style></head><body><div class="head"><div class="title">コマンドライン初心者シミュレータ</div><div class="v">v1</div></div><div class="card"><b>ここでは本物のPCは壊れません</b><div class="help">ブラウザの中だけにある架空のフォルダを操作します。ターミナルを一度も触ったことがない人向けです。まず「今どこにいる？」から始めます。</div></div><div class="card"><div id="lessonTitle" style="font-weight:800"></div><div class="progress" id="progress"></div><div class="explain" id="explain"></div><div class="hint" id="hint"></div><div class="chips" id="chips"></div></div><div class="terminal"><div class="bar">練習用ターミナル — 安全な仮想環境</div><div class="screen" id="screen"></div><div class="inputrow"><div class="prompt">$</div><input id="input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="ここにコマンドを入力"><button id="run">実行</button></div></div><div class="card"><b>使えるコマンド</b><div class="help"><code>pwd</code> 今いる場所 / <code>ls</code> 中身を見る / <code>cd</code> 移動 / <code>mkdir</code> フォルダ作成 / <code>touch</code> ファイル作成 / <code>cat</code> 中身表示 / <code>echo</code> 文字を書く / <code>cp</code> コピー / <code>mv</code> 移動・名前変更 / <code>rm</code> 削除 / <code>clear</code> 画面を消す / <code>help</code> ヘルプ</div></div><script>(()=>{const lessons=[{title:'1. 今いる場所を知る',explain:'コマンドラインでは「自分が今どのフォルダにいるか」が重要です。pwd は present working directory の意味です。',hint:'まず pwd と入力して実行してください。',check:c=>c.trim()==='pwd',chips:['pwd']},{title:'2. 中身を見る',explain:'ls は今いるフォルダの中身を一覧表示します。Finderでフォルダを開く感覚に近いです。',hint:'ls を実行してみましょう。',check:c=>c.trim()==='ls',chips:['ls']},{title:'3. フォルダを作る',explain:'mkdir は make directory。ここでは projects というフォルダを作ります。',hint:'mkdir projects を実行してください。',check:c=>c.trim()==='mkdir projects',chips:['mkdir projects']},{title:'4. フォルダへ移動する',explain:'cd は change directory。projects の中へ移動します。',hint:'cd projects を実行してください。',check:c=>c.trim()==='cd projects',chips:['cd projects','pwd']},{title:'5. ファイルを作る',explain:'touch は空のファイルを作れます。まず note.txt を作ります。',hint:'touch note.txt を実行してください。',check:c=>c.trim()==='touch note.txt',chips:['touch note.txt','ls']},{title:'6. ファイルへ文字を書く',explain:'echo は文字を出力するコマンドです。> を使うと、その出力をファイルへ保存できます。',hint:'echo こんにちは > note.txt を実行してください。',check:c=>/^echo\s+こんにちは\s*>\s*note\.txt$/.test(c.trim()),chips:['echo こんにちは > note.txt']},{title:'7. ファイルを読む',explain:'cat はテキストファイルの中身を表示します。',hint:'cat note.txt で「こんにちは」が出れば成功です。',check:c=>c.trim()==='cat note.txt',chips:['cat note.txt']},{title:'8. コピーする',explain:'cp は copy。note.txt を backup.txt という名前で複製します。',hint:'cp note.txt backup.txt を実行してください。',check:c=>c.trim()==='cp note.txt backup.txt',chips:['cp note.txt backup.txt','ls']},{title:'9. 名前を変える',explain:'mv は move。別フォルダへの移動だけでなく、ファイル名変更にも使えます。',hint:'mv backup.txt memo.txt を実行してください。',check:c=>c.trim()==='mv backup.txt memo.txt',chips:['mv backup.txt memo.txt','ls']},{title:'10. 削除する',explain:'rm は remove。実機では削除が取り消せない場合があるため注意が必要です。このシミュレータでは安全です。',hint:'rm memo.txt を実行してください。',check:c=>c.trim()==='rm memo.txt',chips:['rm memo.txt','ls']}];const fs={type:'dir',children:{home:{type:'dir',children:{user:{type:'dir',children:{welcome:{type:'file',content:'コマンドライン練習へようこそ！'}}}}}}};let path=['home','user'],lesson=0;const screen=document.getElementById('screen'),input=document.getElementById('input');function nodeAt(parts){let n=fs;for(const p of parts){if(!n.children||!n.children[p])return null;n=n.children[p]}return n}function cwd(){return '/'+path.join('/')}function write(s,cls=''){let d=document.createElement('div');d.textContent=s;if(cls)d.className=cls;screen.appendChild(d);screen.scrollTop=screen.scrollHeight}function split(s){return s.match(/"[^"]*"|'[^']*'|\S+/g)?.map(x=>x.replace(/^['"]|['"]$/g,''))||[]}function run(cmd){cmd=cmd.trim();if(!cmd)return;write('$ '+cmd);let redirect=cmd.match(/^echo\s+(.+?)\s*>\s*([^\s]+)$/);if(redirect){let n=nodeAt(path);n.children[redirect[2]]={type:'file',content:redirect[1].replace(/^['"]|['"]$/g,'')};write('');complete(cmd);return}let a=split(cmd),name=a[0],n=nodeAt(path);if(name==='pwd')write(cwd());else if(name==='ls')write(Object.keys(n.children||{}).join('  ')||'(空です)');else if(name==='cd'){if(!a[1]||a[1]==='~')path=['home','user'];else if(a[1]==='..'){if(path.length)path.pop()}else{let t=n.children?.[a[1]];if(t?.type==='dir')path.push(a[1]);else write('cd: そのフォルダはありません','danger')}}else if(name==='mkdir'){if(!a[1])write('mkdir: フォルダ名が必要です','danger');else if(n.children[a[1]])write('mkdir: すでに存在します','danger');else n.children[a[1]]={type:'dir',children:{}}}else if(name==='touch'){if(!a[1])write('touch: ファイル名が必要です','danger');else if(!n.children[a[1]])n.children[a[1]]={type:'file',content:''}}else if(name==='cat'){let f=n.children?.[a[1]];if(f?.type==='file')write(f.content);else write('cat: そのファイルはありません','danger')}else if(name==='cp'){let src=n.children?.[a[1]];if(src?.type==='file'&&a[2])n.children[a[2]]={type:'file',content:src.content};else write('cp: コピー元またはコピー先を確認してください','danger')}else if(name==='mv'){let src=n.children?.[a[1]];if(src&&a[2]){n.children[a[2]]=src;delete n.children[a[1]]}else write('mv: 名前を確認してください','danger')}else if(name==='rm'){if(n.children?.[a[1]]?.type==='file')delete n.children[a[1]];else write('rm: ファイルが見つかりません','danger')}else if(name==='clear'){screen.innerHTML=''}else if(name==='help')write('pwd ls cd mkdir touch cat echo cp mv rm clear help');else write(`${name}: コマンドが見つかりません。help を試してください。`,'danger');complete(cmd)}function complete(cmd){if(lesson<lessons.length&&lessons[lesson].check(cmd)){write('✓ このステップはクリアです','ok');lesson++;renderLesson();if(lesson===lessons.length)write('🎉 基本10ステップ完了！ pwd / ls / cd / mkdir / touch / cat / cp / mv / rm の役割を一通り体験しました。','ok')}}function renderLesson(){const l=lessons[lesson];if(!l){document.getElementById('lessonTitle').textContent='基本編クリア';document.getElementById('progress').textContent='10 / 10';document.getElementById('explain').textContent='あとは自由に架空のファイルやフォルダを作って遊べます。';document.getElementById('hint').textContent='help で使えるコマンドを確認できます。';document.getElementById('chips').innerHTML='';return}document.getElementById('lessonTitle').textContent=l.title;document.getElementById('progress').textContent=`ステップ ${lesson+1} / ${lessons.length}`;document.getElementById('explain').textContent=l.explain;document.getElementById('hint').textContent=l.hint;let chips=document.getElementById('chips');chips.innerHTML='';l.chips.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>{input.value=c;input.focus()};chips.appendChild(b)})}document.getElementById('run').onclick=()=>{run(input.value);input.value='';input.focus()};input.addEventListener('keydown',e=>{if(e.key==='Enter'){run(input.value);input.value=''}});write('安全な練習用ターミナルです。最初の課題を上の説明に沿って実行してください。');renderLesson()})();</script></body></html>
