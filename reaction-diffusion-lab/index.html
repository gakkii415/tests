<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Reaction Diffusion Lab</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;z-index:3}.tag,button{background:#000c;border:1px solid #fff2;color:#fff;border-radius:13px;padding:10px 12px;backdrop-filter:blur(14px)}.tag{font-weight:700}button{margin-left:auto}.hint{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;color:#fffa;white-space:nowrap}.v{position:fixed;right:9px;bottom:5px;font-size:10px;color:#fff5}</style></head><body><canvas id="c"></canvas><div class="top"><div class="tag">Reaction Diffusion</div><button id="reset">再生成</button></div><div class="hint">触ると模様の種を追加</div><div class="v">v1</div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false}),o=document.createElement('canvas'),ox=o.getContext('2d'),reset=document.getElementById('reset');let W,H,N,A,B,A2,B2,img;const DA=1,DB=.5,F=.055,K=.062;function setup(){W=Math.max(150,Math.min(260,Math.round(innerWidth*.58)));H=Math.max(240,Math.round(W*innerHeight/innerWidth));o.width=W;o.height=H;N=W*H;A=new Float32Array(N);B=new Float32Array(N);A2=new Float32Array(N);B2=new Float32Array(N);A.fill(1);img=ox.createImageData(W,H);for(let n=0;n<18;n++)seed(Math.random()*W,Math.random()*H,3+Math.random()*8)}function seed(px,py,r=7){for(let yy=-r;yy<=r;yy++)for(let xx=-r;xx<=r;xx++){if(xx*xx+yy*yy>r*r)continue;let X=(px+xx)|0,Y=(py+yy)|0;if(X>1&&Y>1&&X<W-2&&Y<H-2)B[Y*W+X]=1}}function lap(arr,i){return -arr[i]+.2*(arr[i-1]+arr[i+1]+arr[i-W]+arr[i+W])+.05*(arr[i-W-1]+arr[i-W+1]+arr[i+W-1]+arr[i+W+1])}function step(){for(let y=1;y<H-1;y++)for(let x1=1;x1<W-1;x1++){let i=y*W+x1,a=A[i],b=B[i],r=a*b*b;A2[i]=Math.max(0,Math.min(1,a+(DA*lap(A,i)-r+F*(1-a))));B2[i]=Math.max(0,Math.min(1,b+(DB*lap(B,i)+r-(K+F)*b)))}[A,A2]=[A2,A];[B,B2]=[B2,B]}function render(){let d=img.data;for(let i=0,j=0;i<N;i++,j+=4){let v=Math.max(0,Math.min(255,(A[i]-B[i])*320));d[j]=d[j+1]=d[j+2]=255-v;d[j+3]=255}ox.putImageData(img,0,0);let dpr=Math.min(devicePixelRatio||1,2);if(c.width!==innerWidth*dpr||c.height!==innerHeight*dpr){c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0)}x.imageSmoothingEnabled=true;x.drawImage(o,0,0,innerWidth,innerHeight)}function loop(){for(let i=0;i<3;i++)step();render();requestAnimationFrame(loop)}addEventListener('pointerdown',e=>seed(e.clientX/innerWidth*W,e.clientY/innerHeight*H,8));addEventListener('pointermove',e=>{if(e.buttons)seed(e.clientX/innerWidth*W,e.clientY/innerHeight*H,5)});reset.onclick=setup;setup();loop()})();</script></body></html>
