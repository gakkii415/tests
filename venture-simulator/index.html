<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3ee" />
  <title>Venture Simulator OS</title>
  <style>
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f3ee;color:#171717}
    .loading{height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .box{width:min(440px,100%);background:#fff;border:1px solid #e8e3d9;border-radius:22px;padding:26px;box-shadow:0 18px 50px #0000000d}
    h1{font-size:24px;margin:0 0 10px}p{margin:0;color:#6c675f;line-height:1.7}.bar{height:5px;background:#eee9df;border-radius:99px;margin-top:22px;overflow:hidden}.bar:after{content:"";display:block;width:45%;height:100%;background:#171717;border-radius:99px;animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(120%)}}
  </style>
</head>
<body>
  <main class="loading"><div class="box"><h1>Venture Simulator</h1><p id="status">シミュレーション環境を読み込んでいます。</p><div class="bar"></div></div></main>
  <script>
    (async()=>{
      try{
        if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support gzip decompression.');
        const names=['payload-part-00','payload-part-01','payload-part-02','payload-part-03'];
        const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));
        const b64=parts.join('').replace(/\s/g,'');
        const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
        const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        document.open();document.write(html);document.close();
      }catch(err){
        console.error(err);
        document.getElementById('status').textContent='読み込みに失敗しました。ページを再読み込みしてください。';
      }
    })();
  </script>
</body>
</html>
