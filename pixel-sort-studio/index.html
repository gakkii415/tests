<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pixel Sort Studio</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body{padding:calc(14px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}.head{display:flex;gap:8px;align-items:center;margin-bottom:12px}.title{font-weight:800}.v{font-size:10px;color:#fff6;margin-left:4px}button,.pick{border:1px solid #fff2;background:#111;color:#fff;border-radius:12px;padding:10px 12px;font-weight:650}.pick{display:inline-block;margin-left:auto}input{display:none}canvas{display:block;width:100%;border-radius:16px;background:#080808;min-height:55vh;object-fit:contain}.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}.hint{font-size:12px;color:#fffa;margin:10px 2px}</style></head><body><div class="head"><div class="title">Pixel Sort Studio <span class="v">v1</span></div><label class="pick">写真を選ぶ<input id="file" type="file" accept="image/*"></label></div><canvas id="c"></canvas><div class="hint">明るさの近いピクセルを縦方向に並べ替えてグリッチ化します。</div><div class="row"><button id="sort">Pixel Sort</button><button id="reset">元に戻す</button></div><script>(()=>{const file=document.getElementById('file'),c=document.getElementById('c'),g=c.getContext('2d',{willReadFrequently:true}),sort=document.getElementById('sort'),reset=document.getElementById('reset');let original=null;function drawPlaceholder(){c.width=900;c.height=1200;g.fillStyle='#090909';g.fillRect(0,0,c.width,c.height);g.fillStyle='#fff';g.font='700 42px sans-serif';g.textAlign='center';g.fillText('PHOTO → GLITCH',450,590)}drawPlaceholder();file.onchange=()=>{let f=file.files[0];if(!f)return;let img=new Image();img.onload=()=>{let s=Math.min(1,1400/Math.max(img.width,img.height));c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);g.drawImage(img,0,0,c.width,c.height);original=g.getImageData(0,0,c.width,c.height);URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)};reset.onclick=()=>original&&g.putImageData(original,0,0);sort.onclick=()=>{if(!original)return;let im=g.getImageData(0,0,c.width,c.height),d=im.data,w=c.width,h=c.height;for(let x=0;x<w;x+=2){let y=0;while(y<h){let i=(y*w+x)*4,l=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];if(l<70||l>230){y++;continue}let start=y,arr=[];while(y<h){let j=(y*w+x)*4,q=.2126*d[j]+.7152*d[j+1]+.0722*d[j+2];if(q<70||q>230)break;arr.push([q,d[j],d[j+1],d[j+2],d[j+3]]);y++}arr.sort((a,b)=>a[0]-b[0]);for(let k=0;k<arr.length;k++){let j=((start+k)*w+x)*4;d[j]=arr[k][1];d[j+1]=arr[k][2];d[j+2]=arr[k][3];d[j+3]=arr[k][4];if(x+1<w){d[j+4]=d[j];d[j+5]=d[j+1];d[j+6]=d[j+2];d[j+7]=d[j+3]}}}}g.putImageData(im,0,0)}})();</script></body></html>
