<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Water Ripple Lab</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;z-index:3}.tag,button{background:#000b;border:1px solid #fff2;color:#fff;border-radius:13px;padding:10px 12px;backdrop-filter:blur(14px)}.tag{font-weight:700}button{margin-left:auto}.hint{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;color:#fffa;white-space:nowrap}.v{position:fixed;right:9px;bottom:5px;font-size:10px;color:#fff5}</style></head><body><canvas id="c"></canvas><div class="top"><div class="tag">Water Ripple</div><button id="clear">静める</button></div><div class="hint">触ると波紋が広がる</div><div class="v">v1</div><script>(()=>{const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false}),clear=document.getElementById('clear');let W,H,N,a,b,img,off=document.createElement('canvas'),og=off.getContext('2d');function setup(){W=Math.max(160,Math.min(300,Math.round(innerWidth*.65)));H=Math.max(260,Math.round(W*innerHeight/innerWidth));off.width=W;off.height=H;N=W*H;a=new Float32Array(N);b=new Float32Array(N);img=og.createImageData(W,H)}function splash(cx,cy,p=120){let x=cx/innerWidth*W,y=cy/innerHeight*H;for(let yy=-5;yy<=5;yy++)for(let xx=-5;xx<=5;xx++){if(xx*xx+yy*yy>25)continue;let X=(x+xx)|0,Y=(y+yy)|0;if(X>1&&Y>1&&X<W-2&&Y<H-2)a[Y*W+X]=p}}function step(){for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let i=y*W+x;b[i]=((a[i-1]+a[i+1]+a[i-W]+a[i+W])*0.5-b[i])*.992}[a,b]=[b,a]}function render(){let d=img.data;for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let i=y*W+x,j=i*4,v=(a[i]-a[i+1])*2.5,shade=Math.max(0,Math.min(255,128+v));d[j]=Math.max(0,shade-45);d[j+1]=Math.max(0,shade-5);d[j+2]=Math.min(255,shade+85);d[j+3]=255}og.putImageData(img,0,0);let dpr=Math.min(devicePixelRatio||1,2);if(c.width!==innerWidth*dpr||c.height!==innerHeight*dpr){c.width=innerWidth*dpr;c.height=innerHeight*dpr;g.setTransform(dpr,0,0,dpr,0,0)}g.drawImage(off,0,0,innerWidth,innerHeight)}function loop(){step();render();requestAnimationFrame(loop)}addEventListener('pointerdown',e=>splash(e.clientX,e.clientY));addEventListener('pointermove',e=>{if(e.buttons)splash(e.clientX,e.clientY,45)});clear.onclick=()=>{a.fill(0);b.fill(0)};addEventListener('resize',setup);setup();loop()})();</script></body></html>
