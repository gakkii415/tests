name: Consolidate practice projects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-practice.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate repositories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p basic-website
          for p in .gitattributes README.md _config.yml background.png background2.png background3.png bootstrap2.png desk.png img index.html mac.png style.css team1.png team2.png team3.png; do
            if [ -e "$p" ]; then
              git mv "$p" basic-website/
            fi
          done

          clone_copy() {
            repo="$1"
            dest="$2"
            tmp="${RUNNER_TEMP}/${dest}"
            rm -rf "$tmp" "$dest"
            git clone --depth 1 "https://github.com/gakkii415/${repo}.git" "$tmp"
            rm -rf "$tmp/.git"
            mkdir -p "$dest"
            cp -a "$tmp/." "$dest/"
          }

          clone_copy test01 chair-site
          clone_copy test02 kyoto-navi
          clone_copy test03 fashion-shop
          clone_copy test04 omikuji
          clone_copy character_alarm character-alarm
          clone_copy tetris tetris
          clone_copy daf daf

          git rm .github/workflows/consolidate-practice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate practice projects into test repository"
          git push origin HEAD:main
