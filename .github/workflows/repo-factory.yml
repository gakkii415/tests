name: Repo Factory

on:
  push:
    branches: [main]
    paths:
      - '.repo-factory/request.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REPO_PAT || secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "REPO_PAT or GH_PAT secret is required." >&2
            exit 1
          fi

      - name: Read request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(jq -r '.name' .repo-factory/request.json)
          PRIVATE=$(jq -r '.private // false' .repo-factory/request.json)
          DESCRIPTION=$(jq -r '.description // ""' .repo-factory/request.json)

          if [[ ! "$NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid repository name: $NAME" >&2
            exit 1
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "private=$PRIVATE" >> "$GITHUB_OUTPUT"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"

      - name: Create repository if needed
        shell: bash
        env:
          NAME: ${{ steps.request.outputs.name }}
          PRIVATE: ${{ steps.request.outputs.private }}
          DESCRIPTION: ${{ steps.request.outputs.description }}
        run: |
          set -euo pipefail
          TARGET="gakkii415/$NAME"

          if gh repo view "$TARGET" >/dev/null 2>&1; then
            echo "Repository already exists: $TARGET"
            exit 0
          fi

          gh api --method POST /user/repos \
            -f name="$NAME" \
            -F private="$PRIVATE" \
            -F auto_init=true \
            -f description="$DESCRIPTION"

          echo "Created: https://github.com/$TARGET" >> "$GITHUB_STEP_SUMMARY"
