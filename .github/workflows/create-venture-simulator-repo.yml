name: Venture Simulator repository bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'venture-simulator/**'
      - '.github/workflows/create-venture-simulator-repo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: gakkii415/venture-simulator-os
      TARGET_NAME: venture-simulator-os
      GH_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "REPOSITORY_TOKEN is not configured"
            exit 1
          fi

      - name: Create public repository if needed
        shell: bash
        run: |
          set -euo pipefail
          if gh repo view "$TARGET_REPO" >/dev/null 2>&1; then
            echo "Repository already exists: $TARGET_REPO"
          else
            gh api --method POST /user/repos \
              -f name="$TARGET_NAME" \
              -F private=false \
              -f description='Simulation-first Business OS: prototype a business before launch'
          fi

      - name: Publish app source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/venture-simulator-os
          mkdir -p /tmp/venture-simulator-os
          cp venture-simulator/index.html /tmp/venture-simulator-os/index.html
          cp venture-simulator/payload-part-* /tmp/venture-simulator-os/
          cp venture-simulator/README.md /tmp/venture-simulator-os/README.md
          touch /tmp/venture-simulator-os/.nojekyll
          cd /tmp/venture-simulator-os
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish Venture Simulator MVP"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push --force --set-upstream origin main

      - name: Enable GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$TARGET_REPO/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/$TARGET_REPO/pages" -f source[branch]=main -f source[path]=/
          else
            gh api --method POST "repos/$TARGET_REPO/pages" -f source[branch]=main -f source[path]=/
          fi

      - name: Summary
        run: |
          echo "Repository: https://github.com/$TARGET_REPO" >> "$GITHUB_STEP_SUMMARY"
          echo "App: https://gakkii415.github.io/venture-simulator-os/" >> "$GITHUB_STEP_SUMMARY"
