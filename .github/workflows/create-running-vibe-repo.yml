name: ランニングアプリ用リポジトリ作成

on:
  push:
    branches: [main]
    paths:
      - 'running-vibe/**'
      - '.github/workflows/create-running-vibe-repo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: gakkii415/running-app
      TARGET_NAME: running-app
      GH_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 専用リポジトリを作成
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "REPOSITORY_TOKEN が設定されていません"
            exit 1
          fi
          if gh repo view "$TARGET_REPO" >/dev/null 2>&1; then
            echo "Repository already exists: $TARGET_REPO"
          else
            gh api --method POST /user/repos \
              -f name="$TARGET_NAME" \
              -F private=false \
              -f description='iPhone GPSを使ったランニング経路・距離・標高のWebアプリ'
          fi

      - name: アプリを専用リポジトリへ反映
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/running-app
          mkdir -p /tmp/running-app
          cp running-vibe/index.html /tmp/running-app/index.html
          cd /tmp/running-app
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ランニングアプリ初期版"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push --force --set-upstream origin main

      - name: GitHub Pagesを有効化
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$TARGET_REPO/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/$TARGET_REPO/pages" -f source[branch]=main -f source[path]=/
          else
            gh api --method POST "repos/$TARGET_REPO/pages" -f source[branch]=main -f source[path]=/
          fi

      - name: 結果
        run: |
          echo "Repository: https://github.com/$TARGET_REPO" >> "$GITHUB_STEP_SUMMARY"
          echo "App: https://gakkii415.github.io/running-app/" >> "$GITHUB_STEP_SUMMARY"
