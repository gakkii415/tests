name: Todo app

on:
  push:
    paths:
      - 'todo-app/**'
      - '.github/workflows/todo-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx expo export --platform android --output-dir dist

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npx expo prebuild --platform android --clean
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: todo-android-apk
          path: todo-app/android/app/build/outputs/apk/debug/app-debug.apk

  ios-simulator:
    runs-on: macos-26
    defaults:
      run:
        working-directory: todo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx expo prebuild --platform ios --clean

      - name: Build iPhone Simulator app
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch app and capture UI
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone Simulator found")
          ')

          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

          APP_PATH=$(find ios-build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" com.gakkii415.todoapp
          sleep 5
          xcrun simctl io "$DEVICE_UDID" screenshot ios-screenshot.png

      - uses: actions/upload-artifact@v4
        with:
          name: todo-ios-simulator
          path: todo-app/ios-build/Build/Products/Release-iphonesimulator/*.app

      - uses: actions/upload-artifact@v4
        with:
          name: todo-ios-ui-screenshot
          path: todo-app/ios-screenshot.png

      - name: Publish latest UI screenshot
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p todo-app-preview
          cp todo-app/ios-screenshot.png todo-app-preview/ios.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add todo-app-preview/ios.png
          if ! git diff --cached --quiet; then
            git commit -m "Update Todo iPhone UI preview"
            git push
          fi
