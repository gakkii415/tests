name: Todo app

on:
  push:
    paths:
      - 'todo-app/**'
      - '.github/workflows/todo-app.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx expo export --platform android --output-dir dist

  android-apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npx expo prebuild --platform android --clean
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: todo-android-apk
          path: todo-app/android/app/build/outputs/apk/debug/app-debug.apk

  ios-simulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    defaults:
      run:
        working-directory: todo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx expo prebuild --platform ios --clean
      - name: Build iPhone Simulator app
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - uses: actions/upload-artifact@v4
        with:
          name: todo-ios-simulator
          path: todo-app/ios-build/Build/Products/Debug-iphonesimulator/*.app
