<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>砂・水・火の箱庭</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#111}.top{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;z-index:3;display:flex;gap:8px;align-items:center}.title{font-weight:800;background:#000c;border:1px solid #fff2;border-radius:14px;padding:10px 12px;backdrop-filter:blur(12px)}.clear{margin-left:auto}.toolbar{position:fixed;left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));z-index:3;display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}.toolbar button,.clear{border:1px solid #fff2;background:#000d;color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;white-space:nowrap}.toolbar button.active{outline:2px solid #fff}.hint{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:2;font-size:12px;color:#fffb;background:#0008;padding:6px 10px;border-radius:999px;white-space:nowrap}.v{position:fixed;right:8px;bottom:2px;z-index:5;color:#fff5;font-size:10px}</style></head><body><canvas id="c"></canvas><div class="top"><div class="title">砂・水・火の箱庭</div><button class="clear" id="clear">全部消す</button></div><div class="hint">素材を選んで指で描く</div><div class="toolbar" id="toolbar"></div><div class="v">v1</div><script>(()=>{const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false}),bar=document.getElementById('toolbar');const EMPTY=0,SAND=1,WATER=2,WOOD=3,FIRE=4,OIL=5,WALL=6;const mats=[['砂',SAND],['水',WATER],['木',WOOD],['火',FIRE],['油',OIL],['壁',WALL],['消しゴム',EMPTY]];const colors=['#101010','#e7c06d','#3d8cff','#7a4b28','#ff8a24','#a26a1f','#888'];let W,H,N,grid,life,brush=SAND,down=false,lastX=0,lastY=0;function setup(){W=Math.max(120,Math.min(210,Math.round(innerWidth*.5)));H=Math.max(190,Math.round(W*innerHeight/innerWidth));N=W*H;grid=new Uint8Array(N);life=new Uint8Array(N);let dpr=Math.min(devicePixelRatio||1,2);c.width=innerWidth*dpr;c.height=innerHeight*dpr;g.setTransform(dpr,0,0,dpr,0,0)}function idx(x,y){return y*W+x}function swap(a,b){let t=grid[a];grid[a]=grid[b];grid[b]=t;t=life[a];life[a]=life[b];life[b]=t}function setCell(x,y,t){if(x<0||x>=W||y<0||y>=H)return;let i=idx(x,y);grid[i]=t;life[i]=t===FIRE?35+Math.random()*55:0}function paint(cx,cy){let x=Math.floor(cx/innerWidth*W),y=Math.floor(cy/innerHeight*H),r=brush===FIRE?2:3;for(let yy=-r;yy<=r;yy++)for(let xx=-r;xx<=r;xx++)if(xx*xx+yy*yy<=r*r)setCell(x+xx,y+yy,brush)}function emptyAt(x,y){return x>=0&&x<W&&y>=0&&y<H&&grid[idx(x,y)]===EMPTY}function step(){for(let y=H-2;y>=0;y--){let dir=Math.random()<.5?1:-1;for(let q=0;q<W;q++){let x=dir===1?q:W-1-q,i=idx(x,y),t=grid[i];if(t===SAND){let b=idx(x,y+1);if(grid[b]===EMPTY||grid[b]===WATER||grid[b]===OIL){swap(i,b);continue}for(const dx of [dir,-dir])if(x+dx>=0&&x+dx<W){let d=idx(x+dx,y+1);if(grid[d]===EMPTY||grid[d]===WATER||grid[d]===OIL){swap(i,d);break}}}else if(t===WATER||t===OIL){let moved=false,b=idx(x,y+1);if(grid[b]===EMPTY||(t===WATER&&grid[b]===OIL)){swap(i,b);moved=true}if(!moved){for(const dx of [dir,-dir]){let nx=x+dx;if(nx>=0&&nx<W){let j=idx(nx,y);if(grid[j]===EMPTY){swap(i,j);break}}}}}else if(t===FIRE){life[i]--;let wet=false;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++){let nx=x+xx,ny=y+yy;if(nx<0||nx>=W||ny<0||ny>=H)continue;let j=idx(nx,ny),v=grid[j];if(v===WATER){wet=true;if(Math.random()<.18)grid[j]=EMPTY}else if(v===WOOD&&Math.random()<.035){grid[j]=FIRE;life[j]=55}else if(v===OIL&&Math.random()<.16){grid[j]=FIRE;life[j]=80}}if(wet||life[i]===0){grid[i]=EMPTY;continue}if(y>0&&emptyAt(x,y-1)&&Math.random()<.65)swap(i,idx(x,y-1));else if(Math.random()<.35){let nx=x+(Math.random()<.5?-1:1);if(nx>=0&&nx<W&&emptyAt(nx,y))swap(i,idx(nx,y))}}}}}function render(){g.fillStyle='#101010';g.fillRect(0,0,innerWidth,innerHeight);const cw=innerWidth/W,ch=innerHeight/H;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let t=grid[idx(x,y)];if(!t)continue;if(t===FIRE){let a=.65+Math.random()*.35;g.fillStyle=`rgba(255,${70+Math.random()*120|0},20,${a})`}else g.fillStyle=colors[t];g.fillRect(x*cw,y*ch,Math.ceil(cw+.3),Math.ceil(ch+.3))}}function loop(){for(let i=0;i<2;i++)step();render();requestAnimationFrame(loop)}mats.forEach(([name,t],n)=>{let b=document.createElement('button');b.textContent=name;if(n===0)b.classList.add('active');b.onclick=()=>{brush=t;[...bar.children].forEach(x=>x.classList.remove('active'));b.classList.add('active')};bar.appendChild(b)});addEventListener('pointerdown',e=>{down=true;paint(e.clientX,e.clientY)});addEventListener('pointermove',e=>{if(down)paint(e.clientX,e.clientY)});addEventListener('pointerup',()=>down=false);addEventListener('pointercancel',()=>down=false);document.getElementById('clear').onclick=()=>{grid.fill(0);life.fill(0)};addEventListener('resize',setup);setup();loop()})();</script></body></html>
